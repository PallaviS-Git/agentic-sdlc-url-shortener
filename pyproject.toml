[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-url-shortener"
version = "0.1.0"
description = "Agentic SDLC system — URL shortener demonstration vehicle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",

    # Data validation & settings
    "pydantic==2.7.1",
    "pydantic-settings==2.3.1",

    # Database (used from Step 2 onward)
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",

    # Cache & rate-limiting (used from Step 2 onward)
    "redis[hiredis]==5.0.6",

    # Short-code generation (used from Step 2 onward)
    "python-ulid==2.7.0",

    # HTTP client (integration tests + internal calls)
    "httpx==0.27.0",

    # Retry / resilience (used in orchestration engine)
    "tenacity==8.3.0",

    # DAG / graph (used in orchestration engine)
    "networkx==3.3",

    # Structured logging
    "structlog==24.2.0",

    # Metrics
    "prometheus-client==0.20.0",

    # CLI / terminal output (orchestrator UI)
    "rich==13.7.1",

    # Environment loading
    "python-dotenv==1.0.1",

    # Multipart forms
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "fakeredis==2.23.2",
    "factory-boy==3.3.0",
    "anyio==4.4.0",
    # SQLite async driver for integration tests (no Docker required)
    "aiosqlite==0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "url_shortener*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short"
markers = [
    "unit: pure unit tests — no I/O, no network, no DB",
    "integration: requires running postgres and redis",
    "orchestrator: tests for the agentic orchestration layer",
    "slow: tests that take more than 2 seconds",
]

[tool.coverage.run]
source = ["orchestrator", "url_shortener"]
omit = ["*/tests/*", "*/__init__.py", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
