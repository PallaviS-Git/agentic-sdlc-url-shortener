[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v --tb=short
markers =
    unit: pure unit tests — no I/O, no network, no DB
    integration: ASGI integration tests (SQLite in-memory; no live Postgres/Redis required)
    orchestrator: tests for the agentic orchestration layer
    slow: tests that take more than 2 seconds
